[project]
name = "tair-kvcache-subscriber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.66",
    "pyzmq>=26",
    "msgspec>=0.18",
    "httpx>=0.27",
    "protobuf>=5.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "types-grpcio>=1.0",
    "types-protobuf>=5.28",
]

[project.scripts]
subscriber = "subscriber.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subscriber"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: real ZMQ socket tests (no mocks)"]

[tool.uv]
[[tool.uv.index]]
url = "https://artlab.alibaba-inc.com/1/pypi/simple"
default = true
