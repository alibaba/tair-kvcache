syntax = "proto3";

enum KvCacheGroupMetadataErrorCode {
  KV_CACHE_GROUP_METADATA_OK = 0;
  KV_CACHE_GROUP_METADATA_UNAVAILABLE = 1;
}

message KvCacheGroupMetadataPB {
  int32 group_idx = 1;
  string kind = 2;
  int32 block_size = 3;
  int32 sliding_window = 4;
}

message KvCacheGroupListPB {
  repeated KvCacheGroupMetadataPB items = 1;
  KvCacheGroupMetadataErrorCode err_code = 2;
  string err_msg = 3;
}

message KvCacheGroupsRequestPB {}

service RpcService {
  rpc GetKvCacheGroupsMetadata(KvCacheGroupsRequestPB)
      returns (KvCacheGroupListPB);
}
