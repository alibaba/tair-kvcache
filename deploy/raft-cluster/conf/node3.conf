# KVCM Node 3 — Raft mode (no Redis required)

kvcm.registry_storage.uri=raft://

kvcm.logger.log_level=4
kvcm.service.rpc_port=6381
kvcm.service.http_port=6382
kvcm.service.admin_rpc_port=6491
kvcm.service.admin_http_port=6492
kvcm.service.io_thread_num=2
kvcm.service.enable_debug_service=true
kvcm.service.advertised_host=kvcm-node3

# Raft configuration
kvcm.raft.server_id=3
kvcm.raft.host=kvcm-node3
kvcm.raft.port=9003
kvcm.raft.peers=1:kvcm-node1:9001,2:kvcm-node2:9002,3:kvcm-node3:9003
kvcm.raft.data_dir=/data/raft
kvcm.raft.snapshot_distance=10000
kvcm.raft.election_timeout_lower=150
kvcm.raft.election_timeout_upper=300
kvcm.raft.heart_beat_interval=20

kvcm.startup_config=/conf/startup_config.json
