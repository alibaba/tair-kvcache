name: Qoder Auto Code Review

on:
  pull_request:
    types: [ opened, reopened, unlabeled ]
    branches: [ "main" ]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  qoder-review:
    runs-on: ubuntu-slim
    if: |
      (github.event_name == 'pull_request' && github.event.action != 'unlabeled') ||
      (github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name == 'ai reviewed') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@tair-ci review') && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: hide old comment
        # uses: int128/hide-comment-action@
        uses: int128/hide-comment-action@c0b5ed56339ed2285f922a5da4444b55270c43f3
        with:
          authors: "qoderai[bot]"
      - name: Run Qoder Code Review
        # uses: QoderAI/qoder-action@v0
        uses: QoderAI/qoder-action@0881d27d15a7a93778ebc5c942d11da313ee8b7e
        with:
          qoder_personal_access_token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          prompt: |
            /review-pr
            MANDATORY_REQUIREMENT:"only use COMMENT or APPROVE as event when call submit_pending_pull_request_review. Never use REQUEST_CHANGES."
            REPO:${{ github.repository }} PR_NUMBER:${{ github.event.pull_request.number || github.event.inputs.pr_number || github.event.issue.number }}
          enable_qoder_github_mcp: true

      - name: Add ai reviewed label
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || 
                             context.payload.inputs?.pr_number || 
                             context.payload.issue?.number;
            if (prNumber) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['ai reviewed']
              });
            }