#################################################################################
#################################################################################

## 【在这里把所有的配置都列出来，并加上说明】
## 配置方式有3种，相同配置按照从前往后的覆盖关系
## 1. 在配置文件中配置，如下示例
## 2. 通过启动参数配置，如：$BINARY_NAME --env kvcm.service.rpc_port=6381
## 3. 通过环境变量配置，set_env(kvcm.service.rpc_port, 6381)

#################################################################################
#################################################################################

# 指定本系统自身的数据存储位置
# kvcm.registry_storage.uri=redis://127.0.0.1:6379?auth=123456

# 指定协调后端服务的URI（用于多节点选主、节点信息存储等）。Redis选主key按cluster_name隔离。
# kvcm.coordination.uri=redis://127.0.0.1:6379?auth=123456&cluster_name=kvcm_app_0
# 旧配置 kvcm.distributed_lock.uri 仍可使用（向后兼容），但新配置优先

# 指定选主时当前节点使用的node_id（如果不指定会自动生成）
# kvcm.leader_elector.node_id=node_0

# 指定主节点租约时间。仅单节点的部署模式下建议配置一个很大的值。
# kvcm.leader_elector.lease_ms=600000
# 多节点的部署模式下建议配置一个较低的值
# kvcm.leader_elector.lease_ms=10000

# 指定选主逻辑后台循环间隔时间。仅单节点的部署模式下建议配置一个较大的值。
# kvcm.leader_elector.loop_interval_ms=10000
# 多节点的部署模式下建议配置一个较低的值。建议低于kvcm.leader_elector.lease_ms/10。
# kvcm.leader_elector.loop_interval_ms=100

# 额外指定日志级别，覆盖日志配置文件中的设置，方便进行动态调整
# 0: auto, 1: fatal, 2: error, 3: warn, 4: info, 5: debug
kvcm.logger.log_level=4

# 指定Metaservice主服务的RPC监听端口
kvcm.service.rpc_port=6381

# 指定Metaservice主服务的HTTP监听端口
kvcm.service.http_port=6382

# 指定管控接口的RPC监听端口，如果不指定则和主服务一致
kvcm.service.admin_rpc_port=6491
# 指定管控接口的RPC监听端口，如果不指定则和主服务一致
kvcm.service.admin_http_port=6492

# 指定对外服务IO服务线程数，0 表示自动取机器核数
kvcm.service.io_thread_num=0

# 指定Metrics Reporter类型，可选值：dummy / local / logging / kmonitor
# - dummy: 不采集任何指标
# - local: 本地采集指标到MetricsRegistry，支持Prometheus暴露，无per-query日志开销
# - logging: 在local基础上，每次请求全量dump指标到日志（高QPS下有性能开销）
# - kmonitor: 接入KMonitor监控平台
# 不配置或配置为空时默认使用local
kvcm.metrics.reporter_type=local

# 传递给Metrics Reporter的配置值
# kvcm.metrics.reporter_config=

# 周期性Report任务的唤醒间隔（毫秒），默认20000
# kvcm.metrics.report_interval_ms=20000

# 是否开启DebugService服务，可以通过DebugService直接操作集群内部状态
kvcm.service.enable_debug_service=false

# 删除、系统任务与分层迁移共享的后台线程池总大小，必须大于 1
kvcm.schedule_plan_executor_thread_count=8

# 分层迁移 Prepare/Copy/cleanup 最多同时占用的共享线程池 worker 数；必须满足
# 0 < migration_worker_budget < executor_thread_count，以保证至少一个 worker 可处理回收和系统任务
kvcm.schedule_plan_migration_worker_budget=3

# GetHostCacheState 大请求的独立有界 query executor。worker_count 包含 RPC caller，
# 4 表示 caller + 3 个后台线程；小于 threshold 的请求保持串行。
kvcm.meta_query.worker_count=4
kvcm.meta_query.parallel_threshold=256
kvcm.meta_query.chunk_size=128

# 删除请求在 delay 结束后允许继续抵扣水位的最长时间；只关闭 credit，不中止底层 I/O
kvcm.cache_reclaimer.inflight_delete_timeout_ms=60000

# 单个 Instance Group × Storage Type 的 pending Location 数与 bytes 上限
kvcm.cache_reclaimer.pending_location_limit_per_group_type=100000
kvcm.cache_reclaimer.pending_bytes_limit_per_group_type=68719476736

# 进程级 pending 删除请求数与 bytes 上限
kvcm.cache_reclaimer.pending_delete_handler_limit=1024
kvcm.cache_reclaimer.pending_bytes_limit=274877906944

# 后台 metadata GC 默认开启，只在 leader 上运行。处理长期 WRITING、
# MightExist 明确 missing 的普通 SERVING 以及 EventReport metadata 回收。
kvcm.cache_gc.enabled=true
# active round 每个 tick 最多扫描一个 batch
kvcm.cache_gc.scan_interval_ms=1000
# 完成一轮全量扫描后的休眠时间，默认 2 小时；0 表示下一 tick 可开始新一轮
kvcm.cache_gc.round_pause_ms=7200000
# backend 扫描 batch hint，同时限制单 tick 两类 action 合计的 Location 数
kvcm.cache_gc.scan_batch_size=256
# 自动清理 CLS_WRITING 的 grace，最小 1 小时（3600000ms），默认 24 小时
kvcm.cache_gc.orphan_writing_grace_period_ms=86400000
# 普通删除与 EventReport metadata action 共用的 GC 在途硬上限；默认 2
kvcm.cache_gc.max_inflight_delete_requests=2
# Reconcile EventReport metadata from backend state during the regular GC round.
# Enabled by default when the parent GC switch is on; parent off keeps the legacy path.
kvcm.cache_gc.event_report_cleanup_enabled=true
# Maximum EventReport metadata-only Block keys submitted by one GC tick.
kvcm.cache_gc.event_report_action_batch_size=32

# 重访间隔统计的桶边界（秒），逗号分隔，必须严格升序
# 默认值：1,5,30,60,120,180,300,600,900,1800,3600,21600,86400（13个边界，14个桶含+Inf）
# 修改后需重启服务生效
# kvcm.metrics.revisit_interval_buckets=1,5,30,60,120,180,300,600,900,1800,3600,21600,86400
