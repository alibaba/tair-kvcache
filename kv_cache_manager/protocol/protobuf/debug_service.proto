// 修改本文件前请阅读 docs/develop/proto_modification_guide.md（Proto 文件修改指南），并同步完成其中列出的适配步骤。

syntax = "proto3";

package kv_cache_manager.proto.debug;

option cc_generic_services = false;

enum ErrorCode {
    UNSPECIFIED = 0;
    OK = 1;
    UNSUPPORTED = 2;
    INTERNAL_ERROR = 3;
    SERVICE_NOT_READY = 4;
    INVALID_ARGUMENT = 5;
    DUPLICATE_ENTITY = 6;
    REACH_MAX_ENTITY_CAPACITY = 7;
    INSTANCE_NOT_EXIST = 8;
    SERVER_NOT_LEADER = 9;

    IO_ERROR = 20;
    UNKNOWN_ERROR = 100;
    ERROR_MAX = 65535;
}

message Status {
    ErrorCode code = 1;
    string message = 2;
}

message CommonResponseHeader {
    Status status = 1;
    string request_id = 2;
}

message CommonResponse { CommonResponseHeader header = 1; }

enum StorageType {
    ST_UNSPECIFIED = 0;
    ST_3FS = 1;
    ST_MOONCAKE = 2;
    ST_TAIRMEMPOOL = 3;
    ST_NFS = 4;
    ST_VCNS_3FS = 5;
    ST_DUMMY = 6;
    ST_EVENT_REPORT_L1P5 = 7;
    ST_EVENT_REPORT_L2 = 8;
    ST_TAIRMEMPOOL_SSD = 9;
}

message BoolMasksType { repeated bool values = 1; }

message BlockMask {
    oneof info {
        int32 offset = 1;             // [0, offset) 被mask掉, [offset, +) 是可见的
        BoolMasksType bool_masks = 2; // 需要和 block_keys 数量相等
    }
}

message LocationSpec {
    string name = 1;
    string uri = 2;
    string checksum = 3;
}

message GetCacheMetaDetailRequest {
    string trace_id = 1;
    string instance_id = 2;
    repeated int64 block_keys = 3;
    repeated int64 token_ids = 4;
    BlockMask block_mask = 5;
    int32 detail_level = 6; // 预留，用于控制诊断明细级别
}

enum CacheLocationStatus {
    CLS_NOT_FOUND = 0;
    CLS_NEW = 1;
    CLS_WRITING = 2;
    CLS_SERVING = 3;
    CLS_DELETING = 4;
}

message CacheLocationDetail {
    string location_id = 1;
    CacheLocationStatus status = 2;
    StorageType type = 3;
    int32 spec_size = 4;
    int64 create_time = 5;
    repeated LocationSpec location_specs = 6;
}

message CacheMetaDetailItem {
    int32 request_index = 1;
    int64 block_key = 2;
    // Convenience projection of properties["BP#prev_key"]. The raw property is
    // intentionally retained in properties as well.
    string prev_block_key = 3;
    map<string, string> properties = 4;
    repeated CacheLocationDetail locations = 5;
    // A missing key is a successful lookup represented by CLS_NOT_FOUND;
    // backend/read failures are reported per key so other items can still be returned.
    Status status = 6;
}

message GetCacheMetaDetailResponse {
    CommonResponseHeader header = 1;
    repeated CacheMetaDetailItem items = 2;
}

enum FaultType {
    FT_INTERNAL_ERROR = 0;
}

enum FaultTriggerStrategy {
    ALWAYS = 0; // 总是注入故障
    ONCE = 1; // 在某次请求时注入故障
}

message InjectFaultRequest {
    string api_name = 1;  
    FaultType fault_type = 2;
    FaultTriggerStrategy fault_trigger_strategy= 3;
    int32 trigger_at_call = 4; // FaultTriggerStrategy::ONCE时某个方法第几次被调用时注入故障
}

message RemoveFaultRequest {
  string api_name = 1;  
}

message ClearFaultsRequest {}

service DebugService { 
    // Raw metadata inspection for tests and diagnostics. Available only when the debug service is enabled.
    rpc GetCacheMetaDetail(GetCacheMetaDetailRequest) returns (GetCacheMetaDetailResponse);
    // 给某个方法注入故障
    rpc InjectFault(InjectFaultRequest) returns (CommonResponse);
    // 给某个方法清除故障
    rpc RemoveFault(RemoveFaultRequest) returns (CommonResponse);
    // 清除所有方法故障
    rpc ClearFaults(ClearFaultsRequest) returns (CommonResponse);
}
