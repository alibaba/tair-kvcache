<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">Tair KVCache Manager — server component relationships</title>
<desc id="description">Service calls CacheManager, which coordinates foreground and background components. MetaSearcherManager creates MetaSearcher; MetaSearcher reads and updates MetaIndexer. MetaIndexerManager manages per-instance MetaIndexer objects, which access MetaStorageBackendManager. DataStorageSelector uses DataStorageManager via RegistryManager. CacheReclaimer, CacheGarbageCollector and MigrationManager share SchedulePlanExecutor, which operates on indexes and storage backends. Reclaimer can trigger migration. Inference services report their cache state through ReportEvent, which updates indexes via Searcher and maintains EventReportBackend state. EventReportBackend provides reporter visibility and GC cleanup verdicts. ReportEvent and event-report GC operate on metadata only. ReclaimerTaskSupervisor submits and tracks delete tasks.</desc>
