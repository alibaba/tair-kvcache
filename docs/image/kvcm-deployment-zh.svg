<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">Tair KVCache Manager — deployment architecture</title>
<desc id="description">Three primary domains: inference services, the active-standby KVCM service, and shared KVCache storage. Client/Connector runs in each inference process. Clients discover the Leader through GetClusterInfo, then send metadata requests and inference-side ReportEvent state reports to the Leader. TransferClient reads and writes payloads directly to shared storage. The Leader manages storage health, allocation, deletion and tiered migration. Followers recover state before serving business requests after promotion. Persistent configuration and metadata storage is an auxiliary dependency, with Redis as an optional implementation. Cache reuse is isolated by instance_id.</desc>
