<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">Tair KVCache Manager — system architecture</title>
<desc id="description">Inference clients send metadata requests to the HA-capable KVCM server. TransferClient moves KVCache directly between engine memory and supported storage systems. Inference services report their L1.5/L2 cache state through Client/Connector ReportEvent calls on the metadata plane. Service and CacheManager update indexes and EventReportBackend state. ReportEvent carries metadata only. Admin tools manage configuration; Optimizer subscribes to cache events. HiSim runs independently. Cache reuse is isolated by instance_id.</desc>
